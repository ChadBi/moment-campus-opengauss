<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#174d5e" />
  <title>此刻校园 · 校园生活地图</title>
  <style>
    :root {
      --ink: #152629;
      --ink-2: #40575b;
      --muted: #71858a;
      --paper: #f8fbfa;
      --mist: #eaf1f3;
      --lake: #174d5e;
      --lake-2: #2f6b78;
      --lamp: #ff8a4c;
      --grass: #79a86b;
      --sun: #f2c85b;
      --line: #d4e0e2;
      --white: #ffffff;
      --danger: #d95f59;
      --shadow: 0 18px 50px rgba(20, 55, 63, 0.11);
      --shadow-sm: 0 8px 24px rgba(20, 55, 63, 0.09);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-display: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-data: "DIN Alternate", "Arial Narrow", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--mist);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid rgba(255, 138, 76, .45); outline-offset: 3px; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 88px;
      z-index: 40;
      background: var(--lake);
      color: white;
      padding: 18px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid rgba(255,255,255,.12);
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: var(--paper);
      display: grid;
      place-items: center;
      color: var(--lake);
      box-shadow: inset 0 -4px 0 rgba(23,77,94,.08);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 10px;
      border: 2px solid var(--lamp);
      border-color: var(--lamp) transparent transparent transparent;
      border-radius: 50%;
      transform: rotate(-12deg);
      top: 30px;
      left: 12px;
    }
    .brand-mark strong { font: 700 27px/1 var(--font-display); transform: translateY(-3px); }

    .side-nav { width: 100%; display: grid; gap: 10px; }
    .nav-btn {
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.68);
      border-radius: 16px;
      min-height: 58px;
      display: grid;
      place-items: center;
      gap: 3px;
      cursor: pointer;
      transition: .22s ease;
      padding: 8px 4px;
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn span { font-size: 11px; letter-spacing: .04em; }
    .nav-btn:hover { color: white; background: rgba(255,255,255,.09); }
    .nav-btn.active { color: var(--lake); background: var(--paper); box-shadow: var(--shadow-sm); }
    .sidebar-spacer { flex: 1; }
    .avatar-btn {
      width: 42px; height: 42px; border: 0; border-radius: 14px;
      background: var(--lamp); color: white; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }

    .main {
      grid-column: 2;
      min-width: 0;
      padding: 18px 22px 28px;
    }

    .topbar {
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(220px, .9fr) minmax(320px, 1.4fr) minmax(260px, .9fr);
      align-items: center;
      gap: 20px;
      max-width: 1680px;
      margin: 0 auto 18px;
    }

    .brand-copy { display: flex; align-items: baseline; gap: 11px; white-space: nowrap; }
    .brand-copy h1 { margin: 0; font: 800 28px/1 var(--font-display); letter-spacing: .08em; color: var(--lake); }
    .brand-copy small { color: var(--muted); font-size: 12px; }

    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); width: 20px; color: var(--lake-2); }
    .search-input {
      width: 100%; height: 52px; border: 1px solid transparent; border-radius: 18px;
      background: rgba(255,255,255,.78); padding: 0 50px 0 48px; color: var(--ink);
      box-shadow: 0 8px 28px rgba(20,55,63,.06); transition: .2s ease;
    }
    .search-input:focus { background: white; border-color: rgba(23,77,94,.25); outline: none; box-shadow: var(--shadow-sm); }
    .search-key { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 700 11px/1 var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }

    .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    .campus-select {
      height: 44px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.72);
      padding: 0 34px 0 13px; color: var(--ink-2); cursor: pointer;
    }
    .icon-btn, .primary-btn, .ghost-btn, .soft-btn {
      border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .icon-btn:hover, .primary-btn:hover, .ghost-btn:hover, .soft-btn:hover { transform: translateY(-2px); }
    .icon-btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.74); border: 1px solid var(--line); }
    .icon-btn svg { width: 19px; height: 19px; }
    .primary-btn { min-height: 44px; border-radius: 14px; background: var(--lamp); color: white; padding: 0 17px; font-weight: 750; box-shadow: 0 10px 22px rgba(255,138,76,.24); }
    .primary-btn svg { width: 19px; }
    .ghost-btn { min-height: 42px; border: 1px solid var(--line); background: white; border-radius: 13px; padding: 0 15px; }
    .soft-btn { min-height: 40px; background: #eef6f7; color: var(--lake); border-radius: 13px; padding: 0 14px; font-weight: 700; }

    .content-grid {
      max-width: 1680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 210px minmax(520px, 1fr) 350px;
      gap: 18px;
      align-items: stretch;
      min-height: calc(100vh - 128px);
    }

    .panel {
      background: rgba(248,251,250,.86);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .category-panel { padding: 20px 16px; display: flex; flex-direction: column; min-height: 0; }
    .eyebrow { color: var(--muted); font: 800 11px/1 var(--font-data); letter-spacing: .18em; text-transform: uppercase; }
    .category-panel h2 { font-size: 18px; margin: 9px 4px 14px; }
    .category-list { display: grid; gap: 7px; }
    .category-btn {
      width: 100%; border: 0; background: transparent; min-height: 49px; border-radius: 14px; padding: 0 11px;
      display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px; text-align: left; cursor: pointer;
      color: var(--ink-2); transition: .18s ease;
    }
    .category-btn:hover { background: white; color: var(--ink); }
    .category-btn.active { background: var(--lake); color: white; box-shadow: 0 10px 24px rgba(23,77,94,.22); }
    .cat-icon { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: rgba(23,77,94,.08); font-size: 16px; }
    .category-btn.active .cat-icon { background: rgba(255,255,255,.15); }
    .cat-count { font: 700 12px/1 var(--font-data); opacity: .65; }

    .fresh-card {
      margin-top: auto; background: #e5f0ea; border-radius: 18px; padding: 16px; position: relative; overflow: hidden;
    }
    .fresh-card::after { content: ""; position: absolute; width: 80px; height: 80px; border: 18px solid rgba(121,168,107,.16); border-radius: 50%; right: -28px; bottom: -34px; }
    .fresh-card strong { display: block; color: #356e41; margin-bottom: 7px; font-size: 14px; }
    .fresh-card p { margin: 0; font-size: 12px; line-height: 1.65; color: #58755f; }

    .map-panel { padding: 12px; min-width: 0; display: flex; flex-direction: column; }
    .map-toolbar { min-height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 7px 8px 10px; gap: 10px; }
    .map-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .map-title h2 { margin: 0; font-size: 19px; white-space: nowrap; }
    .live-pill { display: inline-flex; align-items: center; gap: 7px; color: #437047; background: #e6f2e8; border-radius: 999px; padding: 7px 10px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; background: var(--grass); border-radius: 50%; box-shadow: 0 0 0 5px rgba(121,168,107,.13); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(121,168,107,0); } }
    .view-toggle { background: #eaf0f1; padding: 4px; border-radius: 13px; display: flex; gap: 2px; }
    .view-btn { border: 0; background: transparent; padding: 8px 12px; border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .view-btn.active { background: white; color: var(--lake); box-shadow: 0 4px 12px rgba(20,55,63,.09); }

    .campus-map {
      position: relative;
      flex: 1;
      min-height: 620px;
      border-radius: 23px;
      overflow: hidden;
      background: #dcebed;
      border: 1px solid #d1e1e3;
      isolation: isolate;
    }
    .map-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-paper-noise {
      position: absolute; inset: 0; pointer-events: none; opacity: .18; z-index: 1;
      background-image: radial-gradient(rgba(23,77,94,.22) .6px, transparent .6px);
      background-size: 9px 9px;
      mix-blend-mode: multiply;
    }
    .map-caption {
      position: absolute; top: 20px; left: 22px; z-index: 3; color: rgba(21,38,41,.5); font: 800 11px/1 var(--font-data); letter-spacing: .14em;
      background: rgba(248,251,250,.72); border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 9px 12px;
      backdrop-filter: blur(8px);
    }
    .map-scale { position: absolute; left: 20px; bottom: 18px; z-index: 3; display: flex; align-items: flex-end; gap: 7px; color: rgba(21,38,41,.55); font-size: 10px; }
    .scale-line { width: 58px; border-top: 2px solid rgba(21,38,41,.45); position: relative; }
    .scale-line::before,.scale-line::after { content:""; position:absolute; top:-5px; height:8px; border-left:2px solid rgba(21,38,41,.45); }
    .scale-line::before{left:0}.scale-line::after{right:0}

    .pin {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -100%);
      border: 0; background: transparent; cursor: pointer; padding: 0;
      animation: pinIn .45s both;
    }
    @keyframes pinIn { from { opacity:0; transform:translate(-50%,-84%) scale(.82); } to { opacity:1; transform:translate(-50%,-100%) scale(1); } }
    .pin-bubble {
      min-width: 42px; height: 42px; border-radius: 16px 16px 16px 5px; display: grid; place-items: center;
      color: white; font-size: 19px; box-shadow: 0 9px 20px rgba(20,55,63,.24); border: 3px solid rgba(255,255,255,.92);
      transform: rotate(-6deg); transition: .18s ease;
    }
    .pin:hover .pin-bubble, .pin.active .pin-bubble { transform: rotate(0) translateY(-4px) scale(1.08); }
    .pin-label {
      position: absolute; left: 50%; top: 48px; transform: translateX(-50%); white-space: nowrap;
      background: rgba(255,255,255,.91); color: var(--ink); border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 750;
      box-shadow: 0 5px 14px rgba(20,55,63,.1); opacity: 0; pointer-events:none; transition:.18s ease;
    }
    .pin:hover .pin-label, .pin.active .pin-label { opacity:1; top: 52px; }
    .pin[data-category="food"] .pin-bubble { background: #ef7b5c; }
    .pin[data-category="cat"] .pin-bubble { background: #8f72bd; }
    .pin[data-category="print"] .pin-bubble { background: #4d8791; }
    .pin[data-category="photo"] .pin-bubble { background: #de9e39; }
    .pin[data-category="study"] .pin-bubble { background: #5d80b2; }
    .pin[data-category="service"] .pin-bubble { background: #68a56f; }

    .map-legend {
      position: absolute; right: 16px; bottom: 16px; z-index: 4; background: rgba(248,251,250,.88); border: 1px solid rgba(255,255,255,.92);
      border-radius: 15px; padding: 10px 12px; box-shadow: var(--shadow-sm); backdrop-filter: blur(10px); display: flex; gap: 11px; flex-wrap: wrap; max-width: 300px;
    }
    .legend-item { display: flex; gap: 5px; align-items: center; font-size: 10px; color: var(--ink-2); }
    .legend-dot { width: 8px; height: 8px; border-radius: 3px; }

    .list-view { display: none; flex: 1; overflow: auto; padding: 4px; }
    .list-view.active { display: block; }
    .campus-map.hidden { display:none; }
    .place-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .place-card { border:1px solid var(--line); background:white; border-radius:18px; padding:16px; cursor:pointer; transition:.18s ease; }
    .place-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-sm); border-color:rgba(23,77,94,.2); }
    .place-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .place-emoji { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; background:var(--mist); font-size:20px; }
    .freshness { font:800 11px/1 var(--font-data); color:#437047; background:#e6f2e8; padding:7px 9px; border-radius:999px; }
    .place-card h3 { margin:12px 0 7px; font-size:16px; }
    .place-card p { margin:0; color:var(--muted); font-size:12px; line-height:1.65; }
    .place-meta { display:flex; gap:12px; margin-top:13px; color:var(--ink-2); font-size:11px; }

    .right-panel { padding: 20px 17px; min-width: 0; display:flex; flex-direction:column; max-height:calc(100vh - 128px); }
    .right-head { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .right-head h2 { margin:7px 0 0; font-size:19px; }
    .text-btn { border:0; background:transparent; color:var(--lake); font-size:12px; font-weight:750; cursor:pointer; }
    .moment-list { display:grid; gap:11px; overflow:auto; padding-right:3px; }
    .moment-list::-webkit-scrollbar { width:5px; }
    .moment-list::-webkit-scrollbar-thumb { background:#cfdddf; border-radius:10px; }
    .moment-card { background:white; border:1px solid #e1e9ea; border-radius:18px; padding:14px; cursor:pointer; transition:.18s ease; position:relative; overflow:hidden; }
    .moment-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-sm); }
    .moment-card::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent,var(--lake)); }
    .moment-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .moment-author { display:flex; align-items:center; gap:9px; min-width:0; }
    .mini-avatar { width:32px; height:32px; border-radius:11px; display:grid; place-items:center; background:var(--mist); font-weight:800; color:var(--lake); flex:0 0 auto; }
    .moment-author strong { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .moment-author small { color:var(--muted); font-size:10px; }
    .moment-time { font:700 10px/1 var(--font-data); color:var(--muted); white-space:nowrap; }
    .moment-card h3 { font-size:14px; margin:12px 0 6px; }
    .moment-card p { color:var(--ink-2); font-size:12px; line-height:1.65; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .moment-tags { margin-top:11px; display:flex; gap:7px; flex-wrap:wrap; }
    .mini-tag { background:#edf3f4; color:var(--ink-2); border-radius:999px; padding:5px 8px; font-size:10px; }
    .moment-stats { display:flex; gap:13px; margin-top:11px; color:var(--muted); font-size:10px; }

    .bottom-nav { display:none; }

    .modal-backdrop {
      position:fixed; inset:0; z-index:100; background:rgba(16,35,39,.46); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center; padding:22px;
    }
    .modal-backdrop.open { display:flex; animation:fadeIn .18s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      width:min(720px,100%); max-height:min(88vh,820px); overflow:auto; background:var(--paper); border-radius:28px;
      box-shadow:0 30px 90px rgba(8,31,36,.3); border:1px solid rgba(255,255,255,.9); animation:modalIn .25s ease;
    }
    @keyframes modalIn { from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:none} }
    .modal-head { position:sticky; top:0; z-index:2; background:rgba(248,251,250,.92); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); }
    .modal-head h2 { margin:0; font-size:19px; }
    .close-btn { border:0; width:36px; height:36px; border-radius:12px; background:#e9f0f1; cursor:pointer; font-size:20px; }
    .modal-body { padding:22px; }

    .detail-hero { min-height:200px; border-radius:22px; background:linear-gradient(135deg,#cfe3e6,#e9f0d8); padding:24px; display:flex; align-items:flex-end; position:relative; overflow:hidden; }
    .detail-hero::after { content:""; position:absolute; width:230px; height:230px; border:42px solid rgba(255,255,255,.35); border-radius:50%; top:-100px; right:-60px; }
    .detail-icon { position:absolute; right:32px; bottom:29px; font-size:68px; filter:drop-shadow(0 12px 10px rgba(20,55,63,.12)); }
    .detail-hero-copy { position:relative; z-index:1; max-width:72%; }
    .detail-hero-copy h3 { font:800 30px/1.2 var(--font-display); margin:10px 0 8px; }
    .detail-hero-copy p { margin:0; color:var(--ink-2); font-size:13px; line-height:1.7; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .info-box { background:white; border:1px solid var(--line); border-radius:16px; padding:15px; }
    .info-box small { display:block; color:var(--muted); margin-bottom:6px; }
    .info-box strong { font-size:14px; }
    .detail-note { margin-top:16px; background:#fff6ec; border:1px solid #f5dfc8; border-radius:16px; padding:15px; color:#70523b; font-size:13px; line-height:1.75; }
    .detail-actions { display:flex; gap:10px; margin-top:18px; }
    .detail-actions > button { flex:1; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:grid; gap:7px; }
    .field.full { grid-column:1/-1; }
    .field label { font-size:12px; font-weight:750; color:var(--ink-2); }
    .field input,.field select,.field textarea { width:100%; border:1px solid var(--line); background:white; border-radius:13px; padding:12px 13px; outline:none; transition:.18s ease; }
    .field input:focus,.field select:focus,.field textarea:focus { border-color:rgba(23,77,94,.45); box-shadow:0 0 0 4px rgba(23,77,94,.08); }
    .field textarea { resize:vertical; min-height:104px; }
    .form-tip { grid-column:1/-1; background:#e8f2ed; color:#476a51; border-radius:13px; padding:11px 13px; font-size:11px; line-height:1.6; }
    .form-actions { grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }

    .toast {
      position:fixed; left:50%; bottom:28px; z-index:160; transform:translate(-50%,16px); opacity:0; pointer-events:none;
      background:var(--ink); color:white; border-radius:14px; padding:12px 17px; box-shadow:var(--shadow); font-size:13px; transition:.25s ease;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }

    .empty-state { padding:50px 24px; text-align:center; color:var(--muted); }
    .empty-state b { display:block; color:var(--ink); margin:10px 0 5px; }

    @media (max-width: 1280px) {
      .content-grid { grid-template-columns: 190px minmax(500px,1fr) 310px; }
      .topbar { grid-template-columns: 220px 1fr auto; }
      .brand-copy small { display:none; }
      .campus-select { display:none; }
    }
    @media (max-width: 1050px) {
      .content-grid { grid-template-columns: 190px minmax(0,1fr); }
      .right-panel { display:none; }
      .topbar { grid-template-columns: 210px 1fr auto; }
      .campus-map { min-height:650px; }
    }
    @media (max-width: 760px) {
      .app-shell { display:block; }
      .sidebar { display:none; }
      .main { padding:12px 12px 86px; }
      .topbar { display:grid; grid-template-columns:1fr auto; gap:12px; margin-bottom:12px; }
      .brand-copy h1 { font-size:25px; }
      .search-wrap { grid-column:1/-1; grid-row:2; }
      .top-actions .icon-btn, .top-actions .campus-select { display:none; }
      .primary-btn .btn-label { display:none; }
      .primary-btn { width:44px; padding:0; border-radius:14px; }
      .content-grid { display:block; min-height:auto; }
      .category-panel { display:block; padding:13px; margin-bottom:12px; border-radius:20px; }
      .category-panel h2, .category-panel .eyebrow, .fresh-card { display:none; }
      .category-list { display:flex; overflow:auto; gap:8px; padding-bottom:2px; }
      .category-btn { min-width:max-content; width:auto; min-height:42px; display:flex; padding:0 11px; border-radius:13px; }
      .cat-icon { width:28px; height:28px; }
      .cat-count { display:none; }
      .map-panel { padding:8px; border-radius:22px; }

      { placeId: 5, author:'自习搭子', time:'17 分钟前', title:'A203 今晚可以自习', text:'目前大约十八个空位，后排插座能用，讨论声音不大。', tags:['空教室','有插座'], likes:12, comments:2, color:'#5d80b2' },
      { placeId: 1, author:'计科小毕', time:'22 分钟前', title:'北区打印店装订机恢复了', text:'黑白还是 0.2 元一面，微信传文件，今晚预计开到十点。', tags:['打印','答辩'], likes:31, comments:6, color:'#4d8791' },
      { placeId: 4, author:'全媒体摄影部', time:'38 分钟前', title:'图书馆东侧现在是最好看的逆光', text:'湖面反光比较亮，拍人像建议稍微往银杏树方向挪。', tags:['拍照','日落'], likes:25, comments:3, color:'#de9e39' },
      { placeId: 6, author:'梅园住户', time:'45 分钟前', title:'大件快递今天放在南门', text:'不是原来的快递站，别白跑。尾号 7 在右侧货架。', tags:['快递','梅园'], likes:19, comments:7, color:'#68a56f' }
    ];

    const safeStorage = {
      get(key, fallback) {
        try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
        catch (error) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (error) { return false; }
      }
    };

    const state = {
      category: 'all',
      query: '',
      view: 'map',
      page: 'map',
      favorites: new Set(safeStorage.get('ckxy-favorites', [])),
      customPlaces: safeStorage.get('ckxy-custom-places', [])
    };

    const el = id => document.getElementById(id);
    const allPlaces = () => [...initialPlaces, ...state.customPlaces];
    const categoryInfo = id => categories.find(c => c.id === id) || categories[0];

    function filteredPlaces() {
      let data = allPlaces();
      if (state.page === 'favorite') data = data.filter(p => state.favorites.has(p.id));
      if (state.category !== 'all') data = data.filter(p => p.category === state.category);
      if (state.query) {
        const q = state.query.trim().toLowerCase();
        data = data.filter(p => [p.name,p.area,p.status,p.price,p.desc,...p.tags].join(' ').toLowerCase().includes(q));
      }
      return data;
    }

    function renderCategories() {
      const counts = allPlaces().reduce((acc,p)=>(acc[p.category]=(acc[p.category]||0)+1,acc),{});
      el('categoryList').innerHTML = categories.map(c => `
        <button class="category-btn ${state.category===c.id?'active':''}" data-category="${c.id}">
          <span class="cat-icon">${c.icon}</span><span>${c.label}</span><span class="cat-count">${c.id==='all'?allPlaces().length:(counts[c.id]||0)}</span>
        </button>`).join('');
      document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{
        state.category=btn.dataset.category; state.page='map'; syncNav(); renderAll();
      }));
    }

    function renderLegend() {
      el('mapLegend').innerHTML = categories.slice(1).map(c=>`<span class="legend-item"><i class="legend-dot" style="background:${c.color}"></i>${c.label.replace('吃点什么','美食').replace('校园','')}</span>`).join('');
    }

    function renderPlaces() {
      const data = filteredPlaces();
      el('pinsLayer').innerHTML = data.map((p,i)=>`
        <button class="pin" data-id="${p.id}" data-category="${p.category}" style="left:${p.x}%;top:${p.y}%;animation-delay:${i*35}ms" aria-label="查看 ${p.name}">
          <span class="pin-bubble">${p.emoji}</span><span class="pin-label">${p.name}</span>
        </button>`).join('');

      el('placeList').innerHTML = data.length ? data.map(p=>`
        <article class="place-card" data-id="${p.id}" tabindex="0">
          <div class="place-card-top"><span class="place-emoji">${p.emoji}</span><span class="freshness">${p.freshness}</span></div>
          <h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.desc)}</p>
          <div class="place-meta"><span>⌖ ${escapeHtml(p.area)}</span><span>♡ ${p.likes}</span></div>
        </article>`).join('') : `<div class="empty-state"><div style="font-size:40px">⌖</div><b>这里暂时没有匹配的信息</b><span>换个关键词，或者发布第一条地点经验。</span></div>`;

      document.querySelectorAll('[data-id].pin, .place-card[data-id]').forEach(node=>{
        node.addEventListener('click',()=>openDetail(Number(node.dataset.id)));
        node.addEventListener('keydown',e=>{ if(e.key==='Enter') openDetail(Number(node.dataset.id)); });
      });
    }

    function renderMoments() {
      const list = state.page==='favorite' ? moments.filter(m=>state.favorites.has(m.placeId)) : moments;
      el('momentList').innerHTML = list.length ? list.map(m=>`
        <article class="moment-card" data-moment-id="${m.placeId}" style="--accent:${m.color}">
          <div class="moment-top"><div class="moment-author"><span class="mini-avatar">${m.author.slice(0,1)}</span><div><strong>${m.author}</strong><small>已认证校园用户</small></div></div><span class="moment-time">${m.time}</span></div>
          <h3>${m.title}</h3><p>${m.text}</p>
          <div class="moment-tags">${m.tags.map(t=>`<span class="mini-tag"># ${t}</span>`).join('')}</div>
          <div class="moment-stats"><span>♡ ${m.likes}</span><span>◌ ${m.comments}</span><span>仍然有效</span></div>
        </article>`).join('') : `<div class="empty-state"><div style="font-size:36px">♡</div><b>收藏地点后，相关动态会出现在这里</b></div>`;
      document.querySelectorAll('[data-moment-id]').forEach(n=>n.addEventListener('click',()=>openDetail(Number(n.dataset.momentId))));
    }

    function renderHeader() {
      const titleMap = {map:'蠡湖校区生活地图',discover:'今天校园里有什么新鲜事',favorite:'我收藏的校园坐标',mine:'我的校园贡献'};
      el('viewTitle').textContent = titleMap[state.page];
      el('liveText').textContent = state.page==='favorite' ? `${state.favorites.size} 个地点已收藏` : `${Math.max(0,filteredPlaces().length)} 条信息可查看`;
    }

    function renderAll(){ renderCategories(); renderPlaces(); renderMoments(); renderHeader(); }

    function openDetail(id) {
      const p = allPlaces().find(x=>x.id===id); if(!p) return;
      el('detailModalTitle').textContent='地点详情';
      const cat = categoryInfo(p.category);
      const saved = state.favorites.has(p.id);
      el('detailBody').innerHTML = `
        <section class="detail-hero">
          <div class="detail-hero-copy"><span class="eyebrow">${cat.label} · ${escapeHtml(p.freshness)}</span><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.area)} · 距你约 ${escapeHtml(p.distance||'未知')}</p></div>
          <div class="detail-icon">${p.emoji}</div>
        </section>
        <div class="detail-grid">
          <div class="info-box"><small>现在状态</small><strong>${escapeHtml(p.status)}</strong></div>
          <div class="info-box"><small>参考信息</small><strong>${escapeHtml(p.price||'暂无')}</strong></div>
          <div class="info-box"><small>有效确认</small><strong>${p.verify} 人确认仍然有效</strong></div>
          <div class="info-box"><small>贡献者</small><strong>${escapeHtml(p.author)}</strong></div>
        </div>
        <div class="detail-note">${escapeHtml(p.desc)}<div class="moment-tags" style="margin-top:10px">${p.tags.map(t=>`<span class="mini-tag"># ${escapeHtml(t)}</span>`).join('')}</div></div>
        <div class="detail-actions"><button class="ghost-btn" id="favoriteDetail">${saved?'已收藏':'收藏地点'}</button><button class="soft-btn" id="verifyDetail">确认仍然有效</button><button class="primary-btn" id="routeDetail">模拟导航</button></div>`;
      openModal('detailModal');
      el('favoriteDetail').addEventListener('click',()=>toggleFavorite(p.id));
      el('verifyDetail').addEventListener('click',()=>{ p.verify++; p.freshness='刚刚确认'; showToast('已确认：这条信息仍然有效'); openDetail(p.id); renderAll(); });
      el('routeDetail').addEventListener('click',()=>{ closeModal('detailModal'); showToast(`已开始模拟导航：前往${p.name}`); highlightPin(p.id); });
    }

    function toggleFavorite(id){
      state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
      safeStorage.set('ckxy-favorites',[...state.favorites]);
      showToast(state.favorites.has(id)?'已收藏这个校园坐标':'已取消收藏');
      openDetail(id); renderAll();
    }

    function openModal(id){ el(id).classList.add('open'); document.body.style.overflow='hidden'; }
    function closeModal(id){ el(id).classList.remove('open'); document.body.style.overflow=''; }
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
    document.querySelectorAll('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m) closeModal(m.id)}));
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-backdrop.open').forEach(m=>closeModal(m.id)); });

    function showToast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>t.classList.remove('show'),2200); }
    function highlightPin(id){
      if(state.view!=='map') setView('map');
      setTimeout(()=>{ const p=document.querySelector(`.pin[data-id="${id}"]`); if(p){ p.classList.add('active'); setTimeout(()=>p.classList.remove('active'),2600); } },80);
    }

    function setView(view){
      state.view=view;
      document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
      el('campusMap').classList.toggle('hidden',view==='list');
      el('listView').classList.toggle('active',view==='list');
    }
    document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

    function syncNav(){
      document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    }
    document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{
      state.page=b.dataset.page;
      if(state.page==='discover'){ state.category='all'; setView('list'); }
      else if(state.page==='map'){ setView('map'); }
      else if(state.page==='mine'){ openMine(); state.page='map'; }
      syncNav(); renderAll();
    }));

    function openMine(){
      const contributed=state.customPlaces.length;
      el('detailModalTitle').textContent='我的校园档案';
      el('detailBody').innerHTML=`<section class="detail-hero"><div class="detail-hero-copy"><span class="eyebrow">CAMPUS CONTRIBUTOR</span><h3>毕同学的校园档案</h3><p>让校园里的经验不再只停留在聊天记录里。</p></div><div class="detail-icon">🎒</div></section><div class="detail-grid"><div class="info-box"><small>已发布</small><strong>${contributed} 条信息</strong></div><div class="info-box"><small>已收藏</small><strong>${state.favorites.size} 个地点</strong></div><div class="info-box"><small>确认有效</small><strong>12 次</strong></div><div class="info-box"><small>校园贡献值</small><strong>${128+contributed*20}</strong></div></div><div class="detail-note">Demo 账号用于展示个人贡献、收藏与信息维护能力。正式版本可接入统一身份认证，但公开内容应尽量减少不必要的个人信息。</div>`;
      openModal('detailModal');
    }

    el('publishBtn').addEventListener('click',()=>openModal('publishModal'));
    el('publishForm').addEventListener('submit',e=>{
      e.preventDefault();
      const fd=new FormData(e.currentTarget); const cat=categoryInfo(fd.get('category'));
      const index=state.customPlaces.length;
      const p={
        id:Date.now(), name:fd.get('name').trim(), category:fd.get('category'), emoji:cat.icon,
        x:24+(index*13)%66, y:34+(index*17)%50, area:fd.get('area').trim(), status:fd.get('status').trim(), freshness:'刚刚发布',
        price:fd.get('price').trim()||'暂无价格信息', desc:fd.get('desc').trim(), tags:fd.get('tags').trim().split(/\s+/).filter(Boolean).slice(0,4),
        likes:0, verify:1, author:'我发布的', distance:'约 500 m'
      };
      state.customPlaces.unshift(p); safeStorage.set('ckxy-custom-places',state.customPlaces);
      e.currentTarget.reset(); closeModal('publishModal'); state.page='map'; state.category='all'; setView('map'); syncNav(); renderAll(); showToast('已发布，并保存到这台设备'); highlightPin(p.id);
    });

    el('searchInput').addEventListener('input',e=>{ state.query=e.target.value; renderPlaces(); renderHeader(); });
    document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); el('searchInput').focus(); } });
    el('locateBtn').addEventListener('click',()=>{ showToast('已定位：你在第二教学楼附近'); const map=el('campusMap'); map.animate([{transform:'scale(1)'},{transform:'scale(1.012)'},{transform:'scale(1)'}],{duration:550}); });
    el('refreshMoments').addEventListener('click',()=>{ const list=el('momentList'); list.animate([{opacity:.25,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320}); showToast('已刷新校园此刻动态'); });

    function escapeHtml(str=''){ return String(str).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }

    renderLegend(); renderAll(); setView('map');
  </script>
</body>
</html>
